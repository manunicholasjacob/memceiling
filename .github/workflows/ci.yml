name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12", "3.13"]
        exclude:
          # Keep the matrix to a sensible size: the oldest and newest
          # supported interpreters on Linux, newest only elsewhere.
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check the repository is pure ASCII
        shell: bash
        run: |
          # A hard project rule. grep exits 1 when it finds nothing, which
          # is the success case here, so the exit status is inverted.
          if LC_ALL=C grep -rn '[^ -~]' \
              --exclude-dir=.git \
              --exclude-dir=__pycache__ \
              --exclude-dir=.pytest_cache \
              --exclude-dir=build \
              --exclude-dir=dist \
              --exclude-dir='*.egg-info' \
              . ; then
            echo "non-ASCII bytes found above" >&2
            exit 1
          fi
          echo "repository is pure ASCII"

      - name: Build the compiled kernels
        shell: bash
        run: |
          # A runner without a usable toolchain is reported, not fatal.
          python -m memceiling.cli build-c || \
            echo "no compiled kernels here; the numpy path will be used"

      - name: Report what memceiling can read on this runner
        run: python -m memceiling.cli info

      - name: Print the reason-code vocabulary
        run: python -m memceiling.cli schema

      - name: Tests
        run: python -m pytest -v

      - name: Build the distribution
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check the wheel carries the C source
        shell: bash
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          wheels = glob.glob("dist/*.whl")
          if not wheels:
              sys.exit("no wheel was built")
          names = zipfile.ZipFile(wheels[0]).namelist()
          if not any(n.endswith("memceiling/_ckernels.c") for n in names):
              sys.exit("the wheel does not contain memceiling/_ckernels.c: %s" % names)
          print("wheel contains the C kernel source")
          PY

  self-test-action:
    name: the Action measures this runner (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Measure the runner's memory bandwidth ceiling
        id: memceiling
        uses: ./
        with:
          repeats: "3"
          min-run-seconds: "0.2"
          output-path: memceiling-envelope.json
          # A shared CI runner is noisy and its SMBIOS is often hidden, so a
          # non-PASS verdict here is expected and is not a build failure.
          # That is the point of the record: the verdict travels with the
          # number.
          fail-on-invalid: "false"

      - name: Show the outputs the Action exposed
        shell: bash
        run: |
          echo "verdict:       ${{ steps.memceiling.outputs.verdict }}"
          echo "ceiling:       ${{ steps.memceiling.outputs.ceiling-gb-s }} GB/s"
          echo "kernel:        ${{ steps.memceiling.outputs.ceiling-kernel }}"
          echo "read:          ${{ steps.memceiling.outputs.read-gb-s }} GB/s"
          echo "copy:          ${{ steps.memceiling.outputs.copy-gb-s }} GB/s"
          echo "triad:         ${{ steps.memceiling.outputs.triad-gb-s }} GB/s"
          echo "theoretical:   ${{ steps.memceiling.outputs.theoretical-peak-gb-s }} GB/s"
          echo "fraction:      ${{ steps.memceiling.outputs.fraction-percent }} %"
          echo "code path:     ${{ steps.memceiling.outputs.code-path }}"
          echo "envelope:      ${{ steps.memceiling.outputs.envelope-path }}"

      - name: Check the envelope conforms to the shared schema
        shell: bash
        run: |
          python - <<'PY'
          import json, sys
          with open("memceiling-envelope.json", "r", encoding="ascii") as handle:
              envelope = json.load(handle)
          expected = [
              "schema", "tool", "taken_at_utc", "duration_s", "platform",
              "verdict", "reasons", "unreadable", "measurement",
          ]
          if list(envelope) != expected:
              sys.exit("envelope keys are %s, expected %s" % (list(envelope), expected))
          if envelope["schema"] != "measurement-provenance/1":
              sys.exit("unexpected schema id %r" % envelope["schema"])
          if envelope["verdict"] not in ("PASS", "INVALID", "UNSUPPORTED", "UNKNOWN"):
              sys.exit("unexpected verdict %r" % envelope["verdict"])
          print("envelope conforms; verdict", envelope["verdict"])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: memceiling-envelope-${{ matrix.os }}
          path: memceiling-envelope.json
          if-no-files-found: error
